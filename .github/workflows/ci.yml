name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (headless)
        run: make
      - name: Test
        run: make test
      - name: Check every example assembles
        run: |
          for f in examples/*.mech; do
            echo "== $f"
            ./mech check "$f" > /dev/null
          done
